<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>出勤簿 | Shift Sync</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FAFAF7">
    <link rel="stylesheet" href="css/shift.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
    <!--
      注意: 静的サイトのため、このページ自体はURLを知っていれば誰でも開けます。
      暗証番号は誤操作を防ぐためのもので、セキュリティ保護ではありません。
      本番運用(GASモード)では、書き込みはGAS側の管理者トークンで守られます。
      詳しくは SETUP.md を参照してください。
    -->
</head>
<body>
    <!-- 暗証番号(ADMIN_PIN_HASH 設定時のみ表示) -->
    <div class="pin-gate hidden" id="pin-gate">
        <div style="text-align:center;">
            <div class="wordmark" style="font-size:1.375rem;">出勤簿</div>
            <p class="lede">管理者の暗証番号を入力してください</p>
        </div>
        <div class="pin-dots" id="pin-dots"></div>
        <div class="pin-pad" id="pin-pad"></div>
    </div>

    <div id="admin-root" class="hidden">
        <header class="masthead">
            <div class="masthead-title">
                <span class="wordmark">出勤簿</span>
                <span class="wordmark-sub" id="store-name"></span>
            </div>
            <div class="masthead-side">
                <span class="note-mark" id="publish-badge">下書き</span>
            </div>
        </header>

        <main class="sheet sheet-wide">
            <div class="demo-banner hidden" id="demo-banner" title="タップで閉じる">
                デモです。データはこのブラウザにだけ残ります(端末をまたいで共有するには SETUP.md の設定が必要です)
            </div>

            <!-- 週の移動 -->
            <div class="controls">
                <button class="step-btn" id="week-prev" type="button" title="前の週">‹</button>
                <div class="period">
                    <span class="period-range" id="week-label"></span>
                    <span class="period-rel" id="week-sublabel"></span>
                </div>
                <button class="step-btn" id="week-next" type="button" title="次の週">›</button>
                <button class="btn btn-quiet" id="week-today" type="button">今週</button>
                <span class="note-mark" id="submit-counter"></span>
                <div class="spacer"></div>
                <button class="btn btn-quiet" id="reload-btn" type="button">読み直す</button>
                <a class="btn" id="month-link" href="month.html">月間表</a>
                <button class="btn" id="emp-btn" type="button">名簿</button>
                <button class="btn btn-stamp" id="bulk-btn" type="button">希望どおり確定</button>
                <button class="btn btn-ink" id="publish-btn" type="button">スタッフに公開</button>
            </div>

            <!-- 帳簿 -->
            <div class="register-scroll">
                <div class="register" id="shift-grid"></div>
            </div>

            <p class="hint">
                希望をタップすると、時間を調整して確定できます。確定した印をタップすれば変更と取り消し。
                空欄をタップで追加。「希望どおり確定」は、出された時間のまま週の全部をまとめて確定します。
            </p>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/store.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
