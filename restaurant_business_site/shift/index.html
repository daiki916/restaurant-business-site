<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>出勤希望 | Shift Sync</title>
    <meta name="description" content="スマホから希望の出勤時間をタップで送信できるシフト希望収集システム">
    <meta name="theme-color" content="#FAFAF7">
    <link rel="stylesheet" href="css/shift.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sheet">
        <!-- 表題 -->
        <header class="masthead masthead-sticky">
            <div class="masthead-title">
                <span class="wordmark">出勤希望</span>
                <span class="wordmark-sub" id="store-name"></span>
            </div>
            <div class="masthead-side">
                <span class="note-mark hidden" id="submit-badge"></span>
                <button class="signature hidden" id="me-chip" type="button" title="名前を変更">
                    <span class="tag-dot" id="me-dot"></span>
                    <span id="me-name"></span>
                </button>
            </div>
        </header>

        <!-- デモモードの注意書き(タップで閉じる) -->
        <div class="demo-banner hidden" id="demo-banner" title="タップで閉じる">
            デモです。データはこのブラウザにだけ残ります
        </div>

        <!-- 名前を選ぶ(初回のみ) -->
        <section id="view-name" class="hidden">
            <div class="rollcall">
                <h1 class="rollcall-title">あなたの名前を<br>選んでください</h1>
                <p class="rollcall-lead">次回からはこの端末が覚えています</p>
            </div>
            <div class="roster" id="name-grid"></div>
            <div class="blank-state hidden" id="name-empty">
                まだスタッフが登録されていません。<br>管理者に登録を依頼してください。
            </div>
            <div class="add-row hidden" id="self-register" style="padding: 1.375rem 0.875rem;">
                <input type="text" id="self-register-name" placeholder="名前を入力して登録" maxlength="20">
                <button class="btn" id="self-register-btn" type="button">登録</button>
            </div>
        </section>

        <!-- 週の記入・確定シフト -->
        <section id="view-main" class="hidden">
            <div class="period-tabs" id="week-selector"></div>
            <p class="deadline" id="deadline-note"></p>

            <div class="switch-tabs hidden" id="mode-tabs">
                <button class="switch-tab" id="tab-request" type="button">希望を出す</button>
                <button class="switch-tab" id="tab-result" type="button">確定シフト</button>
            </div>

            <!-- 希望の記入 -->
            <div id="request-view">
                <div class="ledger" id="day-list"></div>

                <div class="remarks">
                    <button class="remarks-toggle" id="note-toggle" type="button">
                        <span>備考(任意)</span>
                        <span id="note-toggle-mark">＋</span>
                    </button>
                    <div class="remarks-body hidden" id="note-body">
                        <textarea id="week-note" rows="2" placeholder="例: 水曜は17時までなら入れます"></textarea>
                    </div>
                </div>
            </div>

            <!-- 確定シフト -->
            <div id="result-view" class="hidden">
                <div class="result-list" id="result-list"></div>
                <div style="padding: 1.375rem 0.875rem;">
                    <button class="btn btn-block" id="toggle-everyone" type="button">全員分を見る</button>
                </div>
                <div class="result-list hidden" id="everyone-list"></div>
            </div>
        </section>

        <!-- 集計と提出 -->
        <div class="tally-bar hidden" id="submit-bar">
            <div class="tally-bar-figures" id="submit-summary"></div>
            <button class="btn btn-ink btn-lg" id="submit-btn" type="button">希望を出す</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/store.js"></script>
    <script src="js/employee.js"></script>
</body>
</html>
